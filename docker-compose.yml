version: '3.8'
services:
  specguard:
    build: .
    ports:
      - "8700:8700"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8700/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
