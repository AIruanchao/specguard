name: SDD CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-cov 2>/dev/null || pip install pytest pytest-cov
      - run: python -m pytest --cov=. --cov-report=term-missing --tb=short -q
      - run: python -m py_compile app/main.py 2>/dev/null || true
