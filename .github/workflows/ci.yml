name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short --cov=app --cov-report=term
      
      - name: Compile check
        run: python -m py_compile app/main.py
  
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: specguard:latest

      - name: Coverage gate
        run: |
          python -m pytest --cov=app --cov-fail-under=80 --cov-report=term -q --tb=no || exit 1

      - name: Lint (ruff)
        run: |
          pip install ruff 2>/dev/null || true
          ruff check app/ --select=E,F --ignore=E501 || true

      - name: Security scan (bandit)
        run: |
          pip install bandit 2>/dev/null || true
          bandit -r app/ -f json -o /tmp/bandit-report.json || true
